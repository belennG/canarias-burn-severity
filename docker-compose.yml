services:
  db:
    image: postgis/postgis:16-3.4
    container_name: canarias-burn-severity-db
    environment:
      POSTGRES_USER: canarias
      POSTGRES_PASSWORD: canarias
      POSTGRES_DB: canarias_burn_severity
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canarias -d canarias_burn_severity"]
      interval: 5s
      timeout: 5s
      retries: 10
